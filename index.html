<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Doolhof Beheer Overzicht</title>
    <!-- Konva.js -->
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            font-family: sans-serif;
            touch-action: none; /* Voorkomt standaard browser-scrollgedrag op tablets */
        }
        #info-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 6px;
            pointer-events: none;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info-overlay">
        <strong>Doolhof Kaart (Puzzle_Labyrinth)</strong><br>
        - Sleep / Vingers slepen om te bewegen<br>
        - Muiswiel / Pinch (2 vingers) om in/uit te zoomen
    </div>

    <div id="container"></div>

    <script>
        // 1. Supabase Configuratie
const supabaseUrl = 'https://mgqoxmnryqekrpjglffb.supabase.co';
const supabaseKey = 'sb_publishable_btgAerx5A8O7urSEflRDAg_8NSdtoOu';
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Konva Stage (Canvas) Initialiseren
        const stage = new Konva.Stage({
            container: 'container',
            width: window.innerWidth,
            height: window.innerHeight,
            draggable: true
        });

        const layer = new Konva.Layer();
        stage.add(layer);

        window.addEventListener('resize', () => {
            stage.width(window.innerWidth);
            stage.height(window.innerHeight);
        });

        // 3. Zoom & Pan Functionaliteit (Muiswiel voor desktop)
        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            const scaleBy = 1.1;
            const oldScale = stage.scaleX();
            const pointer = stage.getPointerPosition();

            const mousePointTo = {
                x: (pointer.x - stage.x()) / oldScale,
                y: (pointer.y - stage.y()) / oldScale,
            };

            const newScale = e.evt.deltaY > 0 ? oldScale / scaleBy : oldScale * scaleBy;
            if (newScale < 0.1 || newScale > 5) return;

            stage.scale({ x: newScale, y: newScale });

            const newPos = {
                x: pointer.x - mousePointTo.x * newScale,
                y: pointer.y - mousePointTo.y * newScale,
            };
            stage.position(newPos);
        });

        // 4. Pinch-to-Zoom logica voor Tablets / Touch-schermen
        let lastDist = 0;

        stage.on('touchmove', (e) => {
            const touch1 = e.evt.touches[0];
            const touch2 = e.evt.touches[1];

            if (touch1 && touch2) {
                // Twee vingers: Pinch zoom
                e.evt.preventDefault();
                const dist = Math.sqrt(
                    Math.pow(touch2.clientX - touch1.clientX, 2) +
                    Math.pow(touch2.clientY - touch1.clientY, 2)
                );

                if (!lastDist) {
                    lastDist = dist;
                }

                const scaleBy = dist / lastDist;
                const oldScale = stage.scaleX();
                const newScale = oldScale * scaleBy;

                if (newScale > 0.1 && newScale < 5) {
                    stage.scale({ x: newScale, y: newScale });
                }
                lastDist = dist;
            }
        });

        stage.on('touchend', () => {
            lastDist = 0;
        });

        // 5. Data ophalen uit Supabase en tekenen
        async function loadMazeMap() {
            try {
                const { data: rows, error: roomError } = await supabaseClient
                    .from('Puzzle_Labyrinth')
                    .select('*');

                if (roomError) throw roomError;

                const doorsMap = {};
                const uniqueRoomsMap = {};

                rows.forEach(row => {
                    const roomId = row.room_id || row.id; 
                    const side = row.wall_side;

                    if (!uniqueRoomsMap[roomId] && row.pos_x !== null && row.pos_y !== null) {
                        uniqueRoomsMap[roomId] = {
                            id: roomId,
                            x: row.pos_x,
                            y: row.pos_y
                        };
                    }

                    if (!doorsMap[roomId]) {
                        doorsMap[roomId] = [];
                    }
                    if (side) {
                        doorsMap[roomId].push(side.toLowerCase());
                    }
                });

                const boxSize = 50;
                const spacing = 15;
                const step = boxSize + spacing;

                Object.values(uniqueRoomsMap).forEach(room => {
                    if (room.x === undefined || room.y === undefined) return;

                    const posX = room.x * step;
                    const posY = -room.y * step; // Y-as omgedraaid zodat Noord naar boven wijst

                    // Basis kamer rechthoek
                    const rect = new Konva.Rect({
                        x: posX,
                        y: posY,
                        width: boxSize,
                        height: boxSize,
                        fill: '#88aaff',
                        stroke: '#333333',
                        strokeWidth: 2,
                        cornerRadius: 6
                    });
                    layer.add(rect);

                    // Kamernummer / ID weergave (kleiniger lettertype bij grote getallen)
                    const text = new Konva.Text({
                        x: posX,
                        y: posY + 16,
                        text: `R-${room.id}`,
                        width: boxSize,
                        align: 'center',
                        fontSize: room.id > 999999 ? 9 : 12,
                        fill: '#ffffff',
                        fontStyle: 'bold'
                    });
                    layer.add(text);

                    // Deuren tekenen
                    const roomDoors = doorsMap[room.id] || [];
                    const doorSize = 18;
                    const doorColor = '#cc3333';

                    roomDoors.forEach(side => {
                        let dx = posX, dy = posY, dw = doorSize, dh = 4;

                        if (side === 'north') {
                            dx = posX + (boxSize - doorSize) / 2;
                            dy = posY - 2;
                            dw = doorSize;
                            dh = 4;
                        } else if (side === 'south') {
                            dx = posX + (boxSize - doorSize) / 2;
                            dy = posY + boxSize - 2;
                            dw = doorSize;
                            dh = 4;
                        } else if (side === 'west') {
                            dx = posX - 2;
                            dy = posY + (boxSize - doorSize) / 2;
                            dw = 4;
                            dh = doorSize;
                        } else if (side === 'east') {
                            dx = posX + boxSize - 2;
                            dy = posY + (boxSize - doorSize) / 2;
                            dw = 4;
                            dh = doorSize;
                        }

                        const doorRect = new Konva.Rect({
                            x: dx,
                            y: dy,
                            width: dw,
                            height: dh,
                            fill: doorColor
                        });
                        layer.add(doorRect);
                    });
                });

                layer.draw();

                // 6. Automatisch centreren op het scherm (start bij kamer [0,0] of het midden van de getekende kamers)
                // We centreren het scherm nu mooi rondom coördinaat (0,0) of het middelpunt van de stage:
                stage.position({
                    x: window.innerWidth / 2 - 25,   // compenseert de helft van een kamerbox (50/2)
                    y: window.innerHeight / 2 - 25
                });
                stage.batchDraw();

            } catch (err) {
                console.error('Fout bij het laden van de doolhof data:', err);
            }
        }

        loadMazeMap();
    </script>
</body>
</html>
