<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Doolhof Beheer Overzicht</title>
    <!-- Konva.js -->
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            font-family: sans-serif;
            touch-action: none;
        }
        #info-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 6px;
            pointer-events: none;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info-overlay">
        <strong>Doolhof Kaart (Puzzle_Labyrinth)</strong><br>
        - Klik op een kamer voor details<br>
        - Sleep / Vingers slepen om te bewegen<br>
        - Muiswiel / Pinch (2 vingers) om in/uit te zoomen
    </div>

    <div id="container"></div>

    <script>
        // 1. Supabase Configuratie
        const supabaseUrl = 'https://mgqoxmnryqekrpjglffb.supabase.co';
        const supabaseKey = 'sb_publishable_btgAerx5A8O7urSEflRDAg_8NSdtoOu';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Konva Stage (Canvas) Initialiseren
        const stage = new Konva.Stage({
            container: 'container',
            width: window.innerWidth,
            height: window.innerHeight,
            draggable: true
        });

        const layer = new Konva.Layer();
        stage.add(layer);

        const uiLayer = new Konva.Layer();
        stage.add(uiLayer);

        window.addEventListener('resize', () => {
            stage.width(window.innerWidth);
            stage.height(window.innerHeight);
        });

        // 3. Zoom & Pan Functionaliteit
        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            const scaleBy = 1.1;
            const oldScale = stage.scaleX();
            const pointer = stage.getPointerPosition();

            const mousePointTo = {
                x: (pointer.x - stage.x()) / oldScale,
                y: (pointer.y - stage.y()) / oldScale,
            };

            const newScale = e.evt.deltaY > 0 ? oldScale / scaleBy : oldScale * scaleBy;
            if (newScale < 0.1 || newScale > 5) return;

            stage.scale({ x: newScale, y: newScale });

            const newPos = {
                x: pointer.x - mousePointTo.x * newScale,
                y: pointer.y - mousePointTo.y * newScale,
            };
            stage.position(newPos);
        });

        // 4. Pinch-to-Zoom logica
        let lastDist = 0;
        stage.on('touchmove', (e) => {
            const touch1 = e.evt.touches[0];
            const touch2 = e.evt.touches[1];

            if (touch1 && touch2) {
                e.evt.preventDefault();
                const dist = Math.sqrt(
                    Math.pow(touch2.clientX - touch1.clientX, 2) +
                    Math.pow(touch2.clientY - touch1.clientY, 2)
                );

                if (!lastDist) lastDist = dist;

                const scaleBy = dist / lastDist;
                const oldScale = stage.scaleX();
                const newScale = oldScale * scaleBy;

                if (newScale > 0.1 && newScale < 5) {
                    stage.scale({ x: newScale, y: newScale });
                }
                lastDist = dist;
            }
        });

        stage.on('touchend', () => { lastDist = 0; });

        // 5. Versleepbare Info Container
        const infoBoxWidth = 260;
        const infoBoxHeight = 110;

        const infoGroup = new Konva.Group({
            x: 20,
            y: 90,
            draggable: true
        });

        const infoBg = new Konva.Rect({
            width: infoBoxWidth,
            height: infoBoxHeight,
            fill: 'rgba(0, 0, 0, 0.85)',
            stroke: '#555',
            strokeWidth: 1,
            cornerRadius: 8
        });
        infoGroup.add(infoBg);

        const infoText = new Konva.Text({
            x: 12,
            y: 12,
            text: 'Klik op een kamer\nvoor details...',
            fontSize: 13,
            fill: '#ffffff',
            lineHeight: 1.4,
            width: infoBoxWidth - 24
        });
        infoGroup.add(infoText);
        uiLayer.add(infoGroup);

        infoGroup.on('mousedown touchstart', (e) => {
            e.cancelBubble = true;
        });

        // Helper functie voor tekst inkorten
        function truncate(str, n) {
            if (!str) return 'Geen';
            return (str.length > n) ? str.substr(0, n - 1) + '...' : str;
        }

        // 6. Data ophalen uit Supabase en tekenen
        async function loadMazeMap() {
            try {
                const { data: rows, error: roomError } = await supabaseClient
                    .from('Puzzle_Labyrinth')
                    .select('*');

                if (roomError) throw roomError;

                const roomsDataMap = {};

                rows.forEach(row => {
                    const roomId = row.room_id || row.id; 
                    const side = row.wall_side;

                    if (!roomsDataMap[roomId]) {
                        roomsDataMap[roomId] = {
                            id: roomId,
                            x: row.pos_x,
                            y: row.pos_y,
                            designer: row.user_name || row.designer || 'Onbekend',
                            puzzleName: row.puzzle_name || row.name || 'Geen puzzel',
                            doors: []
                        };
                    }

                    if (side && !roomsDataMap[roomId].doors.includes(side.toLowerCase())) {
                        roomsDataMap[roomId].doors.push(side.toLowerCase());
                    }
                });

                const boxSize = 50;
                const spacing = 15;
                const step = boxSize + spacing;

                Object.values(roomsDataMap).forEach(room => {
                    if (room.x === undefined || room.y === undefined) return;

                    const posX = room.x * step;
                    const posY = -room.y * step;

                    const roomGroup = new Konva.Group({
                        x: posX,
                        y: posY,
                        cursor: 'pointer'
                    });

                    // Basis kamer rechthoek (deze krijgt nu een 'hitFunc' of we vangen de klik direct op de rect op)
                    const rect = new Konva.Rect({
                        width: boxSize,
                        height: boxSize,
                        fill: '#88aaff',
                        stroke: '#333333',
                        strokeWidth: 2,
                        cornerRadius: 6
                    });
                    roomGroup.add(rect);

                    const text = new Konva.Text({
                        y: 16,
                        text: `R-${room.id}`,
                        width: boxSize,
                        align: 'center',
                        fontSize: room.id > 999999 ? 9 : 12,
                        fill: '#ffffff',
                        fontStyle: 'bold',
                        listening: false // Zorgt dat de muisklik door de tekst heen direct op de kamer valt
                    });
                    roomGroup.add(text);

                    // Deuren tekenen
                    const doorSize = 18;
                    const doorColor = '#cc3333';

                    room.doors.forEach(side => {
                        let dx = 0, dy = 0, dw = doorSize, dh = 4;

                        if (side === 'north') {
                            dx = (boxSize - doorSize) / 2;
                            dy = -2;
                            dw = doorSize;
                            dh = 4;
                        } else if (side === 'south') {
                            dx = (boxSize - doorSize) / 2;
                            dy = boxSize - 2;
                            dw = doorSize;
                            dh = 4;
                        } else if (side === 'west') {
                            dx = -2;
                            dy = (boxSize - doorSize) / 2;
                            dw = 4;
                            dh = doorSize;
                        } else if (side === 'east') {
                            dx = boxSize - 2;
                            dy = (boxSize - doorSize) / 2;
                            dw = 4;
                            dh = doorSize;
                        }

                        const doorRect = new Konva.Rect({
                            x: dx,
                            y: dy,
                            width: dw,
                            height: dh,
                            fill: doorColor,
                            listening: false
                        });
                        roomGroup.add(doorRect);
                    });

                    // Klik / Tap event direct op de roomGroup koppelen
                    roomGroup.on('click tap', () => {
                        console.log("Kamer geklikt:", room.id); // Test of hij aanslaat in je console

                        rect.fill('#ffaa33');
                        layer.batchDraw();
                        setTimeout(() => {
                            rect.fill('#88aaff');
                            layer.batchDraw();
                        }, 200);

                        const formattedDoors = room.doors.length > 0 
                            ? room.doors.map(d => d.charAt(0).toUpperCase() + d.slice(1)).join(', ') 
                            : 'Geen';

                        const safePuzzleName = truncate(room.puzzleName, 30);

                        infoText.text(
                            `Room: R-${room.id}\n` +
                            `Doors: ${formattedDoors}\n` +
                            `By: ${room.designer}\n` +
                            `Puzzle: ${safePuzzleName}`
                        );
                        uiLayer.batchDraw();
                    });

                    layer.add(roomGroup);
                });

                layer.draw();

                stage.position({
                    x: window.innerWidth / 2 - 25,
                    y: window.innerHeight / 2 - 25
                });
                stage.batchDraw();

            } catch (err) {
                console.error('Fout bij het laden van de doolhof data:', err);
            }
        }

        loadMazeMap();
    </script>
</body>
</html>
