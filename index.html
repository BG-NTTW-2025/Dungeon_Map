<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Doolhof Beheer Overzicht</title>
    <!-- Konva.js -->
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            font-family: sans-serif;
            touch-action: none;
        }
        #info-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #555;
            padding: 12px 15px;
            border-radius: 8px;
            pointer-events: auto;
            font-size: 13px;
            z-index: 10;
            line-height: 1.5;
            min-width: 250px;
        }
    </style>
</head>
<body>

    <div id="info-overlay">
        <strong>Map Puzzle Dungeon</strong><br>
        <span id="stat-rooms">Rooms: Laten laden...</span><br>
        <span id="stat-doors">Doors: Laten laden...</span><br>
        <hr style="border-color: #444; margin: 6px 0;">
        <div id="room-details">
            - Click on a room for details<br>
            - Drag to move dungeon<br>
            - Mousewheel / Pinch (2 vingers) to zoom
        </div>
    </div>

    <div id="container"></div>

    <script>
        // 1. Supabase Configuratie
        const supabaseUrl = 'https://mgqoxmnryqekrpjglffb.supabase.co';
        const supabaseKey = 'sb_publishable_btgAerx5A8O7urSEflRDAg_8NSdtoOu';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
	
        // Controleer of de bezoeker wel is ingelogd als designer
        async function checkDesignerAccess() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                document.body.innerHTML = `
                    <div style="color: white; background: #1a1a2e; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; text-align: center; padding: 20px;">' +
                        '<h2 style="color: #e94560; margin-bottom: 10px;">Access Denied</h2>' +
                        '<p style="color: #aaa; margin-bottom: 20px;">You must be logged in as a designer to view the Dungeon Map.</p>' +
                        '<a href="https://bg-nttw-2025.github.io/Dungeon_Submit_Puzzle/" style="background: #0f3460; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold;">Back to Log In</a>' +
                    '</div>';
                
                throw new Error('Unauthorized');
            }
        }

        checkDesignerAccess();

        // 2. Konva Stage (Canvas) Initialiseren
        const stage = new Konva.Stage({
            container: 'container',
            width: window.innerWidth,
            height: window.innerHeight,
            draggable: true
        });

        const layer = new Konva.Layer();
        stage.add(layer);

        const uiLayer = new Konva.Layer();
        stage.add(uiLayer);

        window.addEventListener('resize', () => {
            stage.width(window.innerWidth);
            stage.height(window.innerHeight);
        });

        // 3. Zoom & Pan Functionaliteit
        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            const scaleBy = 1.1;
            const oldScale = stage.scaleX();
            const pointer = stage.getPointerPosition();

            const mousePointTo = {
                x: (pointer.x - stage.x()) / oldScale,
                y: (pointer.y - stage.y()) / oldScale,
            };

            const newScale = e.evt.deltaY > 0 ? oldScale / scaleBy : oldScale * scaleBy;
            if (newScale < 0.1 || newScale > 5) return;

            stage.scale({ x: newScale, y: newScale });

            const newPos = {
                x: pointer.x - mousePointTo.x * newScale,
                y: pointer.y - mousePointTo.y * newScale,
            };
            stage.position(newPos);
        });

        // 4. Pinch-to-Zoom logica
        let lastDist = 0;
        stage.on('touchmove', (e) => {
            const touch1 = e.evt.touches[0];
            const touch2 = e.evt.touches[1];

            if (touch1 && touch2) {
                e.evt.preventDefault();
                const dist = Math.sqrt(
                    Math.pow(touch2.clientX - touch1.clientX, 2) +
                    Math.pow(touch2.clientY - touch1.clientY, 2)
                );

                if (!lastDist) lastDist = dist;

                const scaleBy = dist / lastDist;
                const oldScale = stage.scaleX();
                const newScale = oldScale * scaleBy;

                if (newScale > 0.1 && newScale < 5) {
                    stage.scale({ x: newScale, y: newScale });
                }
                lastDist = dist;
            }
        });

        stage.on('touchend', () => { lastDist = 0; });

        // 5. Functie om Rooms en Doors op te halen en te tonen in de overlay
        async function updateGlobalStats() {
            try {
                const { data: roomData, error: roomError } = await supabaseClient
                    .from('puzzle_labyrinth')
                    .select('room_id')
                    .order('room_id', { ascending: false })
                    .limit(1);

                const { data: idData, error: idError } = await supabaseClient
                    .from('puzzle_labyrinth')
                    .select('id')
                    .order('id', { ascending: false })
                    .limit(1);

                if (!roomError && roomData && roomData.length > 0) {
                    const maxRoom = roomData[0].room_id || 0;
                    document.getElementById('stat-rooms').textContent = "Rooms: " + maxRoom;
                } else {
                    document.getElementById('stat-rooms').textContent = "Rooms: 0";
                }

                if (!idError && idData && idData.length > 0) {
                    const maxId = idData[0].id || 0;
                    const totalDoors = Math.floor(maxId / 2);
                    document.getElementById('stat-doors').textContent = "Doors: " + totalDoors;
                } else {
                    document.getElementById('stat-doors').textContent = "Doors: 0";
                }
            } catch (err) {
                console.error('Fout bij ophalen globale statistieken:', err);
            }
        }

        updateGlobalStats();
        setInterval(updateGlobalStats, 60 * 60 * 1000);

        const infoBoxWidth = 280;
        const infoBoxHeight = 160;

        const infoText = new Konva.Text({
            x: 12,
            y: 12,
            text: 'Click on a room\nfor details...',
            fontSize: 13,
            fill: '#ffffff',
            lineHeight: 1.4,
            width: infoBoxWidth - 24
        });

        function truncate(str, n) {
            if (!str) return 'No';
            return (str.length > n) ? str.substr(0, n - 1) + '...' : str;
        }

        // 7. Data ophalen uit Supabase en tekenen
        async function loadMazeMap() {
            try {
                const { data: rows, error: roomError } = await supabaseClient
                    .from('puzzle_labyrinth')
                    .select('*');

                if (roomError) throw roomError;

                const roomsDataMap = {};

                rows.forEach(row => {
                    const roomId = row.room_id || row.id; 
                    const side = row.wall_side;

                    if (!roomsDataMap[roomId]) {
                        roomsDataMap[roomId] = {
                            id: roomId,
                            x: row.pos_x,
                            y: row.pos_y,
                            walls: []
                        };
                    }

                    if (side) {
                        roomsDataMap[roomId].walls.push({
                            side: side.toLowerCase(),
                            designer: row.designer_name || 'Unknown',
                            puzzleName: row.puzzle_name || 'No puzzle'
                        });
                    }
                });

                const sideOrder = { 'north': 1, 'east': 2, 'south': 3, 'west': 4 };
                const boxSize = 50;
                const spacing = 15;
                const step = boxSize + spacing;

                Object.values(roomsDataMap).forEach(room => {
                    if (room.x === undefined || room.y === undefined) return;

                    room.walls.sort((a, b) => (sideOrder[a.side] || 99) - (sideOrder[b.side] || 99));

                    const posX = room.x * step;
                    const posY = -room.y * step;

                    const roomGroup = new Konva.Group({
                        x: posX,
                        y: posY,
                        cursor: 'pointer'
                    });

                    const rect = new Konva.Rect({
                        width: boxSize,
                        height: boxSize,
                        fill: '#88aaff',
                        stroke: '#333333',
                        strokeWidth: 2,
                        cornerRadius: 6
                    });
                    roomGroup.add(rect);

                    const text = new Konva.Text({
                        y: 16,
                        text: "R-" + room.id,
                        width: boxSize,
                        align: 'center',
                        fontSize: room.id > 999999 ? 9 : 12,
                        fill: '#ffffff',
                        fontStyle: 'bold',
                        listening: false
                    });
                    roomGroup.add(text);

                    const doorSize = 18;
                    const doorColor = '#cc3333';

                    room.walls.forEach(wall => {
                        let dx = 0, dy = 0, dw = doorSize, dh = 4;

                        if (wall.side === 'north') {
                            dx = (boxSize - doorSize) / 2;
                            dy = -2;
                            dw = doorSize;
                            dh = 4;
                        } else if (wall.side === 'south') {
                            dx = (boxSize - doorSize) / 2;
                            dy = boxSize - 2;
                            dw = doorSize;
                            dh = 4;
                        } else if (wall.side === 'west') {
                            dx = -2;
                            dy = (boxSize - doorSize) / 2;
                            dw = 4;
                            dh = doorSize;
                        } else if (wall.side === 'east') {
                            dx = boxSize - 2;
                            dy = (boxSize - doorSize) / 2;
                            dw = 4;
                            dh = doorSize;
                        }

                        const doorRect = new Konva.Rect({
                            x: dx,
                            y: dy,
                            width: dw,
                            height: dh,
                            fill: doorColor,
                            listening: false
                        });
                        roomGroup.add(doorRect);
                    });

                    // Klik / Tap event
                    roomGroup.on('click tap', () => {
                        rect.fill('#ffaa33');
                        layer.batchDraw();
                        setTimeout(() => {
                            rect.fill('#88aaff');
                            layer.batchDraw();
                        }, 200);

                        let displayText = "<strong>Room: R-" + room.id + "</strong><br>";

                        if (room.walls.length === 0) {
                            displayText += "No doors/puzzles found.";
                        } else {
                            room.walls.forEach(wall => {
                                const formattedSide = wall.side.charAt(0).toUpperCase() + wall.side.slice(1);
                                const safePuzzleName = truncate(wall.puzzleName, 30);
                                displayText += "Door: " + formattedSide + "<br>";
                                displayText += "By: " + wall.designer + "<br>";
                                displayText += "Puzzle: " + safePuzzleName + "<br>";
                            });
                        }

                        document.getElementById('room-details').innerHTML = displayText;
                    });

                    // Dubbelklik event
                    roomGroup.on('dblclick', () => {
                        localStorage.setItem('target_room', room.id);
                        window.open('https://bg-nttw-2025.github.io/Dungeon/', 'dungeon_game_window');
                    });

                    layer.add(roomGroup);
                });

                layer.draw();

                stage.position({
                    x: window.innerWidth / 2 - 25,
                    y: window.innerHeight / 2 - 25
                });
                stage.batchDraw();

            } catch (err) {
                console.error('Fout bij het laden van het doolhof:', err);
            }
        }

        loadMazeMap();

    </script>
</body>
</html>
